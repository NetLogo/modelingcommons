# PostgreSQL versions 7.4 - 8.1
#
# Get the C bindings:
#   gem install postgres
# or use the pure-Ruby bindings on Windows:
#   gem install postgres-pr
development:
  adapter: postgresql
  database: <%= ENV.fetch('DATABASE_NAME', 'nlcommons_development') %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'nlcommons') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'nlcommons') %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>
  port: <%= ENV.fetch('DATABASE_PORT', '5432') %>
  encoding: UTF8

staging:
  adapter: postgresql
  database: <%= ENV.fetch('DATABASE_NAME', 'nlcommons_staging') %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'nlcommons') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'nlcommons') %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>
  port: <%= ENV.fetch('DATABASE_PORT', '5432') %>
  encoding: UTF8

# Warning: The database defined as 'test' will be erased and
# re-generated from your development database when you run 'rake'.
# Do not set this db to the same as development or production.
test: &TEST
  adapter: postgresql
  database: <%= ENV.fetch('DATABASE_NAME', 'nlcommons_test') %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'nlcommons') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'nlcommons') %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>
  port: <%= ENV.fetch('DATABASE_PORT', '5432') %>
  encoding: UTF8

production:
  adapter: postgresql
  database: <%= ENV.fetch('DATABASE_NAME', 'nlcommons_production') %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'nlcommons') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'nlcommons') %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>
  port: <%= ENV.fetch('DATABASE_PORT', '5432') %>
  encoding: UTF8

# Nothing to report here

cucumber:
  <<: *TEST
